[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "website-governance-audit"
version = "0.1.0"
description = "Audit a website for indexation, metadata, accessibility, plain-language, structured data, and internal link problems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Callan Pyfer" }]
dependencies = ["beautifulsoup4>=4.12", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/callanspyfer/website-governance-audit"

[project.scripts]
webaudit = "webaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
